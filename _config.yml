title: Brodi
description: Integration Consultant specialised in Message-Oriented Middleware. Tying applications together is my game. 'Manageable' tying only of course :) , with some 'architectual overview'. Avoid the spagetti!
lang: en
baseurl: ""
url: "https://dvdbr.github.io"

