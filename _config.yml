contact:
  address:
    - Utrecht
    - Nederland
  email: no do not need more spam
  website: www.brodi.nl
  website_url: https://www.brodi.nl

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .idea/
  - vendor/
