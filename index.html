---
layout: hacker
title: Contact
---
<h1>{{ site.title }}</h1>
<div class="contact-info">
    <p><strong>Adres:</strong><br>
    {% for line in site.contact.address %}{{ line }}{% unless forloop.last %}<br>
    {% endunless %}{% endfor %}</p>
    <p><strong>Telefoon:</strong><br>
    {{ site.contact.phone }}</p>
    <p><strong>E-mail:</strong><br>
    <a href="mailto:{{ site.contact.email }}">{{ site.contact.email }}</a></p>
    <p><strong>Website:</strong><br>
    <a href="{{ site.contact.website_url }}" target="_blank">{{ site.contact.website }}</a></p>
</div>
